# OAISS CHAIN - Ingress (nginx-ingress-controller)
# Prerequisites:
#   - nginx ingress controller installed (https://kubernetes.github.io/ingress-nginx/)
#   - TLS cert secret "oaiss-chain-tls" created (or use cert-manager)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oaiss-chain-ingress
  namespace: oaiss-chain
  labels:
    app: oaiss-chain
  annotations:
    # --- Ingress class ---
    kubernetes.io/ingress.class: nginx
    # --- TLS (cert-manager) ---
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # --- CORS ---
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://oaiss.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    # --- Rate limiting (100 req/s per IP) ---
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # --- Proxy tuning ---
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oaiss.example.com
      secretName: oaiss-chain-tls
  rules:
    - host: oaiss.example.com
      http:
        paths:
          # Actuator endpoints — IP-restricted (admin only)
          - path: /api/v1/actuator
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
            # IP whitelist for actuator (admin network only)
            # nginx.ingress.kubernetes.io/server-snippet: |
            #   location /api/v1/actuator {
            #     allow 10.0.0.0/8;
            #     allow 172.16.0.0/12;
            #     allow 192.168.0.0/16;
            #     deny all;
            #   }
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
