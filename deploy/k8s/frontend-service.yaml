# OAISS CHAIN - Frontend Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: oaiss-chain
  labels:
    app: oaiss-chain
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: oaiss-chain
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
