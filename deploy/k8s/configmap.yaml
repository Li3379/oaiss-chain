# OAISS CHAIN - ConfigMap (non-secret configuration)
# All environment-specific values should be overridden per-environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oaiss-chain-config
  namespace: oaiss-chain
  labels:
    app: oaiss-chain
data:
  # --- Spring Boot Backend ---
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_URL: "jdbc:mysql://host.minikube.internal:3306/oaiss_chain?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
  DB_DRIVER: "com.mysql.cj.jdbc.Driver"
  DB_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
  REDIS_HOST: "host.minikube.internal"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  MINIO_ENDPOINT: "http://host.minikube.internal:9000"
  MINIO_BUCKET: "oaiss-chain"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,https://oaiss.example.com"
  ML_SERVICE_URL: "http://ml-service.oaiss-chain.svc.cluster.local:8001"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"

  # --- ML Service ---
  ML_MODEL_PATH: "/app/models"
  ML_LOG_LEVEL: "info"
  ML_WORKERS: "2"

  # --- Frontend (Nginx) ---
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "1024"
  BACKEND_UPSTREAM: "backend-service.oaiss-chain.svc.cluster.local:8080"
