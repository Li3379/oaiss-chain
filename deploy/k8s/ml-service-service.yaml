# OAISS CHAIN - ML Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: oaiss-chain
  labels:
    app: oaiss-chain
    component: ml-service
spec:
  type: ClusterIP
  selector:
    app: oaiss-chain
    component: ml-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
