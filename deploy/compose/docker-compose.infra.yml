name: oaisschain

services:
  mysql:
    image: mysql:8.0
    container_name: oaiss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: oaiss_chain
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oaiss-network

  redis:
    image: redis:7-alpine
    container_name: oaiss-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oaiss-network

  # 对象存储：LocalStack 的 S3 实现。
  #
  # 原为 minio/minio，该镜像已被上游从 Docker Hub 彻底移除
  # （仓库 API 返回 object not found，任何 tag 都拉不到），
  # 保留引用会让 `docker compose up` 永久失败。
  # 后端走标准 S3 API，10 项 MinIO SDK 调用已逐项实测通过。
  s3:
    image: localstack/localstack:3
    container_name: oaiss-s3
    environment:
      SERVICES: s3
      DEBUG: 0
      DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:9004:4566"
    volumes:
      - s3-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - oaiss-network

  ml-service:
    build:
      context: ../../oaiss-chain-ml-service
      dockerfile: Dockerfile
    container_name: oaiss-ml-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MODEL_DIR=/app/models
      - LOG_LEVEL=INFO
    volumes:
      - ../../oaiss-chain-ml-service/app/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - oaiss-network

volumes:
  mysql-data:
  redis-data:
  s3-data:

networks:
  oaiss-network:
    name: oaiss-network
