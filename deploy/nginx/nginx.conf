# OAISS CHAIN — Nginx 反向代理 + 负载均衡配置
# 部署到 /etc/nginx/nginx.conf 或 Docker 容器中

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;  # 文件上传限制

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 后端负载均衡池
    upstream backend_pool {
        # 默认轮询（round-robin）
        server backend:8080 max_fails=3 fail_timeout=30s;

        # 水平扩展时取消注释，添加更多后端实例
        # server backend2:8080 max_fails=3 fail_timeout=30s;
        # server backend3:8080 max_fails=3 fail_timeout=30s;

        # 健康检查（Nginx Plus 或第三方模块支持主动健康检查）
        # keepalive 32;
    }

    # ML 服务负载均衡池
    upstream ml_service_pool {
        server ml-service:8001 max_fails=3 fail_timeout=30s;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务器
    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        # SSL 证书（替换为真实证书路径）
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API 反向代理到后端负载均衡池
        location /api/v1/ {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket 支持（如需要实时通知）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ML 服务代理（可选，仅在需要直接访问时）
        location /ml/ {
            proxy_pass http://ml_service_pool/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 前端 SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
