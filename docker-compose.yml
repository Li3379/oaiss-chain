name: oaisschain

services:
  mysql:
    image: mysql:8.0
    container_name: oaiss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: oaiss_chain
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oaiss-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 对象存储：LocalStack 的 S3 实现。
  #
  # 原为 minio/minio，该镜像已被上游从 Docker Hub 彻底移除
  # （仓库 API 返回 object not found，任何 tag 都拉不到），
  # 保留引用会让 `docker compose up` 永久失败。
  # 后端走标准 S3 API，10 项 MinIO SDK 调用已逐项实测通过。
  s3:
    image: localstack/localstack:3
    container_name: oaiss-s3
    environment:
      SERVICES: s3
      DEBUG: 0
      DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:9004:4566"
    volumes:
      - s3-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 10
  backend:
    build:
      context: ./oaiss-chain-backend
      dockerfile: Dockerfile
    container_name: oaiss-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 必须包含 fabric：不含 fabric 时 Spring 会加载 MockBlockchainService，
      # 把 tx_mock_ 假哈希写进 blockchain_tx_hash，报告被标记为「已上链」——
      # 这是「全真」原则明令禁止的假数据来源。SecurityStartupValidator 也会拒绝启动。
      #
      # 若只想起中间件做纯本地业务调试，请显式设置 OAISS_ALLOW_MOCK_CHAIN=true，
      # 此时 Mock 不产出任何 txHash，报告停留在「审核通过」而非「已上链」。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,fabric}
      # 容器内不能用 127.0.0.1 连 peer：peer 是另一个容器，须走服务名。
      FABRIC_ENABLED: ${FABRIC_ENABLED:-true}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-peer0.org1.example.com:7051}
      FABRIC_PEER_HOST_OVERRIDE: ${FABRIC_PEER_HOST_OVERRIDE:-peer0.org1.example.com}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://s3:4566
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_SECRET: ${ML_SERVICE_SECRET:-}
      RSA_KEK: ${RSA_KEK:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:80}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  frontend:
    build:
      context: ./oaiss-chain-frontend
      dockerfile: Dockerfile
    container_name: oaiss-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  ml-service:
    build:
      context: ./oaiss-chain-ml-service
      dockerfile: Dockerfile
    container_name: oaiss-ml-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MODEL_DIR=/app/models
      - LOG_LEVEL=INFO
      - ML_SERVICE_SECRET=${ML_SERVICE_SECRET:-}
      # Copilot LLM 为可选能力：留空即走内置规则引擎（见 app/config.py）
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ./oaiss-chain-ml-service/app/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mysql-data:
  redis-data:
  s3-data:
