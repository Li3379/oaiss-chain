name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'oaiss-chain-backend/**'
      - 'oaiss-chain-frontend/**'
      - 'oaiss-chain-ml-service/**'
      - '.env.prod.example'
      - '.env.staging.example'
      - 'docker-compose.yml'
      - 'deploy/compose/**'
      - 'scripts/bootstrap-remote-release-host.sh'
      - 'scripts/closure-audit.mjs'
      - 'scripts/prod-compose.sh'
      - 'scripts/prod-compose.ps1'
      - 'scripts/validate-prod-env.mjs'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    # 刻意**不再**加 paths 过滤。
    #
    # 历史缺陷：pull_request 带了 paths 过滤，而 `e2e` 是分支保护的必需检查。
    # 一个只改文档的 PR 不会命中任何 path → 工作流根本不启动 → **不存在**名为
    # `e2e` 的 check run → 分支保护永远等不到它 → PR 永久停在 BLOCKED。
    # 实测复现：PR #29（只改一个 .md）其余 7 项全绿，仍无法合并。
    #
    # 正确做法：让工作流总是触发，再由 changes 作业决定是否真跑 e2e。
    #   - 有相关改动 → e2e 正常执行
    #   - 无相关改动 → e2e 作业被 skip，但**仍会产生 check run**（conclusion=skipped），
    #     分支保护接受 skipped 为通过，PR 得以正常合并
    # 代价是每个 PR 多一个几秒的 changes 作业，远小于「文档 PR 无法合并」。
  workflow_dispatch:

jobs:
  # 判定本次 PR 是否触碰了 e2e 覆盖的范围。
  # 用 git diff 而不是第三方 action：少一个外部依赖，语义也更直白。
  changes:
    # 与 e2e 作业一致固定到 24.04：workflow-verify 门禁要求凡依赖 Playwright
    # 的工作流不得使用 ubuntu-latest（详见下方 e2e 作业的说明）。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史，否则与 base 的 merge-base 不可达，diff 会失败
          fetch-depth: 0

      - id: filter
        name: Check whether e2e-relevant files changed
        run: |
          set -euo pipefail

          # workflow_dispatch：人工触发，默认视为相关
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "非 PR 触发，直接跑 e2e"
            exit 0
          fi

          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"

          echo "--- 改动文件 ---"
          echo "$changed"

          relevant=false
          if printf '%s\n' "$changed" | grep -qE '^(oaiss-chain-(backend|frontend|ml-service)/|\.env\.(prod|staging)\.example$|docker-compose\.yml$|deploy/compose/|scripts/(bootstrap-remote-release-host\.sh|closure-audit\.mjs|prod-compose\.sh|prod-compose\.ps1|validate-prod-env\.mjs)$|\.github/workflows/e2e-tests\.yml$)'; then
            relevant=true
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "e2e 相关改动: $relevant"

  e2e:
    needs: changes
    # 无相关改动时整体跳过：作业仍会产生 check run（skipped），
    # 分支保护视其为通过，避免「文档 PR 永远合不了」。
    if: needs.changes.outputs.relevant == 'true'
    timeout-minutes: 30
    # 固定到 24.04，不用 ubuntu-latest。
    #
    # ubuntu-latest 已迁移到 26.04，而当前 Playwright 1.59.1 明确报
    #   "Playwright does not support chromium on ubuntu26.04-x64"
    # 直接导致浏览器装不上、所有 E2E 用例报 "Executable doesn't exist"。
    #
    # 选择固定 runner 而不是升级 Playwright：runner 镜像升级是上游行为，
    # 而 Playwright 大版本升级会带来断言/选择器行为变化，风险更大。
    # 待 Playwright 支持 26.04 后再评估放开。
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oaiss_chain
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # 对象存储：改用 LocalStack 的 S3 实现。
      #
      # 原先用 minio/minio，但该镜像已被上游从 Docker Hub 彻底移除
      # （仓库 API 返回 object not found，任何 tag 都拉不到），
      # 导致本工作流在 Runner 上 100% 失败，报错还伪装成「权限不足」。
      #
      # 后端走的是标准 S3 API（io.minio SDK），实测以下 10 项在该镜像上全部可用：
      # bucketExists / makeBucket / putObject / getObject / statObject /
      # listObjects / copyObject / removeObject / removeObjects / getPresignedObjectUrl
      #
      # 桶由后端启动时自动创建（MinioService.initBucket @EventListener），无需额外初始化容器。
      s3:
        image: localstack/localstack:3
        env:
          SERVICES: s3
          DEBUG: 0
          DEFAULT_REGION: us-east-1
        ports:
          - 9000:4566
        options: >-
          --health-cmd="curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: e2e-test-jwt-secret-key-minimum-32-characters
      SPRING_PROFILES_ACTIVE: docker
      # 区块链 fail-closed（2026-11-03 起）：未激活 fabric profile 时启动会直接抛
      # SecurityException，除非显式放行 mock 链。
      #
      # CI 的 e2e 起不了完整 Fabric 网络（peer/orderer 不在 runner 上），
      # 所以这里必须显式声明逃生门。语义上这是「允许启动」，不是「伪造存证」：
      # MockBlockchainService 在该模式下不产出任何 txHash，报告停在「审核通过」，
      # e2e 用例也不应该断言 tx_mock_ 之类的假哈希。
      OAISS_ALLOW_MOCK_CHAIN: "true"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minio-test-access
      MINIO_SECRET_KEY: minio-test-secret-key
      API_BASE_URL: http://localhost:8080/api/v1
      # 私钥加密密钥。AesGcmEncryptor 在构造时强制要求该变量，缺失即抛
      # IllegalStateException 让应用启动失败——这是有意的 Fail-Closed 设计，
      # 防止私钥在无加密情况下落库。CI 只跑 Flyway 种子数据，不涉及真实密钥，
      # 因此用固定测试值：32 字节 base64（openssl rand -base64 32 的格式）。
      RSA_KEK: KP/oKs7nQn3oWivvwFZMEEFgD6fVBGzS72DBTzJwH0g=
      # E2E 登录走 API 直接换取 token，不带验证码。默认值是 true，
      # 不显式关掉的话所有用例都会在登录处报 {"code":2006,"message":"验证码错误"}。
      # 生产环境必须保持默认 true——只在测试环境关闭。
      SECURITY_CAPTCHA_ENABLED: "false"
      # 关闭接口限流。登录端点默认 5 次/60 秒（AuthController @RateLimit），
      # 而 E2E 有几十个用例各登录一次，必然撞限流——表现为
      # "Cannot read properties of undefined (reading 'accessToken')"，
      # 因为限流响应里没有 data 字段。限流是生产保护，不是测试对象。
      OAISS_RATELIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: oaiss-chain-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: |
          cd oaiss-chain-frontend
          npm ci

      # Playwright 浏览器必须在这里装好。
      #
      # 原先它排在「Run backend 之后」，而后续的 v1.1 步骤带 if: success() || failure()，
      # 于是前面任何一步失败都会跳过安装、却仍然执行测试，
      # 报错全是 "Executable doesn't exist at .../chrome-headless-shell"——
      # 看起来像 Playwright 坏了，实际是根本没装。
      - name: Install Playwright
        if: always()
        run: |
          cd oaiss-chain-frontend
          npx playwright install --with-deps chromium

      - name: Validate production env template
        run: |
          node scripts/validate-prod-env.mjs | tee prod-env-validation.txt

      - name: Validate staging env template
        run: |
          node scripts/validate-prod-env.mjs .env.staging.example | tee staging-env-validation.txt

      - name: Validate strict deployment env guardrails
        run: |
          set +e
          node scripts/validate-prod-env.mjs --require-real-secrets .env.prod.example > strict-prod-env-validation.txt 2>&1
          strict_prod_exit=$?
          if [ "$strict_prod_exit" -eq 0 ]; then
            echo "Expected strict production env validation to fail for placeholder template" >&2
            exit 1
          fi

          node scripts/validate-prod-env.mjs --require-real-secrets .env.staging.example > strict-staging-env-validation.txt 2>&1
          strict_staging_exit=$?
          if [ "$strict_staging_exit" -eq 0 ]; then
            echo "Expected strict staging env validation to fail for placeholder template" >&2
            exit 1
          fi

          set -e
          SMOKE_DB_PASS="SmokeDb$(openssl rand -hex 8)"
          SMOKE_REDIS_PASS="SmokeRedis$(openssl rand -hex 8)"
          SMOKE_JWT_SECRET="$(openssl rand -hex 24)"
          SMOKE_ML_SECRET="$(openssl rand -hex 12)"
          SMOKE_GRAFANA_PASS="SmokeGrafana$(openssl rand -hex 8)"
          SMOKE_SMTP_PASS="SmokeSmtp$(openssl rand -hex 8)"
          SMOKE_WEBHOOK_SECRET="$(openssl rand -hex 12)"
          SMOKE_FABRIC_CA_PASS="SmokeFabricCA$(openssl rand -hex 8)"
          SMOKE_COUCHDB_PASS="SmokeCouchDB$(openssl rand -hex 8)"
          SMOKE_MINIO_ACCESS="SmokeMinioAccess$(openssl rand -hex 4)"
          SMOKE_MINIO_SECRET="$(openssl rand -hex 12)"
          cat > strict-release-smoke.env <<EOF
          SPRING_PROFILES_ACTIVE=prod,fabric
          LOG_LEVEL=INFO
          APP_LOG_LEVEL=INFO
          BACKEND_IMAGE=ghcr.io/example-org/oaiss-chain-backend:release-smoke-tag
          FRONTEND_IMAGE=ghcr.io/example-org/oaiss-chain-frontend:release-smoke-tag
          ML_SERVICE_IMAGE=ghcr.io/example-org/oaiss-chain-ml-service:release-smoke-tag
          CORS_ALLOWED_ORIGINS=https://app.example.com
          DB_URL=jdbc:mysql://mysql.example.internal:3306/oaiss_chain?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
          DB_USERNAME=oaiss_app
          DB_PASSWORD=${SMOKE_DB_PASS}
          DB_POOL_MIN_IDLE=5
          DB_POOL_MAX_SIZE=20
          DB_POOL_CONNECTION_TIMEOUT_MS=30000
          DB_POOL_LEAK_DETECTION_MS=0
          REDIS_HOST=redis.example.internal
          REDIS_PORT=6379
          REDIS_DATABASE=0
          REDIS_PASSWORD=${SMOKE_REDIS_PASS}
          JWT_SECRET=${SMOKE_JWT_SECRET}
          JWT_EXPIRATION_MS=3600000
          JWT_REFRESH_EXPIRATION_MS=604800000
          RSA_KEK=QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo0MTIzNDU2Nzg5MDE=
          MINIO_ENDPOINT=https://object-storage.example.internal
          MINIO_ACCESS_KEY=${SMOKE_MINIO_ACCESS}
          MINIO_SECRET_KEY=${SMOKE_MINIO_SECRET}
          MINIO_BUCKET=oaiss-chain-prod
          MINIO_PRESIGNED_URL_EXPIRY_SECONDS=1800
          ML_LOG_LEVEL=INFO
          ML_SERVICE_URL=http://ml-service:8001
          ML_SERVICE_SECRET=${SMOKE_ML_SECRET}
          ML_SERVICE_CONNECT_TIMEOUT=5s
          ML_SERVICE_READ_TIMEOUT=30s
          REQUIRE_OPS_SECRETS=true
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${SMOKE_GRAFANA_PASS}
          ALERT_SMTP_HOST=smtp.example.com
          ALERT_SMTP_USERNAME=alerts@example.com
          ALERT_SMTP_PASSWORD=${SMOKE_SMTP_PASS}
          ALERT_WEBHOOK_URL=https://alerts.example.com/webhook
          ALERT_WEBHOOK_SECRET=${SMOKE_WEBHOOK_SECRET}
          BACKEND_LOG_DIR=./runtime-logs/backend
          FRONTEND_LOG_DIR=./runtime-logs/frontend
          ML_LOG_DIR=./runtime-logs/ml-service
          FABRIC_ENABLED=true
          FABRIC_MSP_ID=Org1MSP
          FABRIC_CHANNEL_NAME=mychannel
          FABRIC_CHAINCODE_NAME=carbon-chaincode
          FABRIC_PEER_ENDPOINT=peer0.org1.example.internal:7051
          FABRIC_TLS_ENABLED=true
          FABRIC_PEER_TLS_CERT_PATH=/run/secrets/fabric/peer-tls-ca.crt
          FABRIC_CERT_PATH=/run/secrets/fabric/user-cert.pem
          FABRIC_KEY_PATH=/run/secrets/fabric/user-key.pem
          FABRIC_CA_ENABLED=true
          FABRIC_CA_ENDPOINT=https://ca.org1.example.internal:7054
          FABRIC_CA_ADMIN_NAME=admin
          FABRIC_CA_ADMIN_PASSWORD=${SMOKE_FABRIC_CA_PASS}
          FABRIC_COUCHDB_USER=admin
          FABRIC_COUCHDB_PASSWORD=${SMOKE_COUCHDB_PASS}
          FABRIC_SECRETS_DIR=./secrets/fabric
          FABRIC_SECRETS_MOUNT_PATH=/run/secrets/fabric
          EOF
          node scripts/validate-prod-env.mjs --require-real-secrets strict-release-smoke.env | tee strict-release-env-validation.txt
          ./scripts/prod-compose.sh --env-file strict-release-smoke.env --compose-file docker-compose.release.yml config > strict-release-compose-config.txt
          grep -q "SPRING_PROFILES_ACTIVE: prod,fabric" strict-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-backend:release-smoke-tag" strict-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-frontend:release-smoke-tag" strict-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-ml-service:release-smoke-tag" strict-release-compose-config.txt
          grep -q "/app/logs" strict-release-compose-config.txt
          grep -q "/run/secrets/fabric" strict-release-compose-config.txt
          rm -f strict-release-smoke.env

      - name: Install ML test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 pydantic==2.10.6 pydantic-settings==2.7.1 httpx==0.28.1

      - name: Validate production compose config
        run: |
          chmod +x scripts/prod-compose.sh
          export SPRING_PROFILES_ACTIVE=default
          export DB_PASSWORD=local-shadow-value
          export JWT_SECRET=local-shadow-jwt
          export REDIS_HOST=localhost
          export MINIO_ENDPOINT=http://localhost:9004
          ./scripts/prod-compose.sh --env-file .env.prod.example config > prod-compose-config.txt
          grep -q "SPRING_PROFILES_ACTIVE: prod" prod-compose-config.txt
          grep -q "DB_USERNAME: oaiss_app" prod-compose-config.txt
          grep -q "CORS_ALLOWED_ORIGINS: https://app.example.com" prod-compose-config.txt
          grep -q "MINIO_ENDPOINT: https://object-storage.example.internal" prod-compose-config.txt

      - name: Validate release compose config
        run: |
          chmod +x scripts/prod-compose.sh
          ./scripts/prod-compose.sh --env-file .env.prod.example --compose-file docker-compose.release.yml config > release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-backend:replace_with_release_tag" release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-frontend:replace_with_release_tag" release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-ml-service:replace_with_release_tag" release-compose-config.txt
          grep -q "SPRING_PROFILES_ACTIVE: prod,fabric" release-compose-config.txt
          grep -q "/app/logs" release-compose-config.txt
          grep -q "/run/secrets/fabric" release-compose-config.txt

      - name: Validate staging release compose config
        run: |
          chmod +x scripts/prod-compose.sh
          ./scripts/prod-compose.sh --env-file .env.staging.example --compose-file docker-compose.release.yml config > staging-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-backend:replace_with_staging_release_tag" staging-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-frontend:replace_with_staging_release_tag" staging-release-compose-config.txt
          grep -q "image: ghcr.io/example-org/oaiss-chain-ml-service:replace_with_staging_release_tag" staging-release-compose-config.txt
          grep -q "SPRING_PROFILES_ACTIVE: staging,fabric" staging-release-compose-config.txt
          grep -q "/app/logs" staging-release-compose-config.txt
          grep -q "/run/secrets/fabric" staging-release-compose-config.txt

      - name: Smoke test remote release host bootstrap script
        run: |
          # 先跑单元级测试：覆盖「用户名与组名不同」这个曾在 CI 上导致
          # invalid group 退出的场景，比直接跑脚本更容易定位问题
          bash scripts/ops/test-bootstrap-remote-release-host.sh
          chmod +x scripts/bootstrap-remote-release-host.sh
          set +e
          ./scripts/bootstrap-remote-release-host.sh --target-dir ./tmp/release-host-smoke-ci --deploy-user "$(id -un)" > bootstrap-release-host-smoke.txt 2>&1
          BOOT_EXIT=$?
          set -e
          if [ "$BOOT_EXIT" -ne 0 ]; then
            echo "::error::bootstrap script exited $BOOT_EXIT"
            cat bootstrap-release-host-smoke.txt
            exit 1
          fi
          fail=0
          for d in runtime-logs/backend runtime-logs/frontend runtime-logs/ml-service secrets/fabric backups scripts; do
            if [ ! -d "./tmp/release-host-smoke-ci/$d" ]; then
              echo "::error::missing directory: $d"; fail=1
            fi
          done
          if ! grep -q "Directory layout ready" bootstrap-release-host-smoke.txt; then
            echo "::error::output missing 'Directory layout ready'"; fail=1
          fi
          # 脚本会实际执行 `docker compose version`，输出形如
          # "Docker Compose version v2.29.7"。原先断言字面量
          # "docker compose version"，与实际输出永远不匹配。
          if ! grep -qiE "(docker[- ]compose|Docker Compose) version" bootstrap-release-host-smoke.txt; then
            echo "::error::output missing docker compose version line"; fail=1
          fi
          rm -rf ./tmp/release-host-smoke-ci
          [ "$fail" -eq 0 ]

      - name: Run repository closure audit
        run: |
          node scripts/closure-audit.mjs | tee closure-audit.txt

      - name: Run backend security and contract tests
        run: |
          cd oaiss-chain-backend
          mvn -q "-Dtest=SecurityStartupValidatorTest,CorsAllowedOriginsConfigTest,ProductionDataPolicyValidatorTest,MlServiceConfigTest,ProductionProfileContractTest" test

      - name: Run ML security tests
        run: |
          python -m unittest oaiss-chain-ml-service.tests.test_security

      - name: Build backend
        run: |
          cd oaiss-chain-backend
          mvn clean package -DskipTests -B

      - name: Run backend
        run: |
          cd oaiss-chain-backend
          # 输出同时写文件，便于等待失败时回溯启动过程
          java -jar target/*.jar > ../backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          # 180s：首次启动要跑完 19 个 Flyway 迁移并初始化缓存预热，
          # 原生健康检查还要连 MySQL/Redis/S3 三个服务。本地约 18s，
          # 但 Runner 冷启动 + 服务容器就绪延迟会显著拉长。
          set +e
          timeout 180 bash -c 'until curl -sf http://localhost:8080/api/v1/actuator/health > /dev/null 2>&1; do sleep 3; done'
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::backend did not become healthy within 180s"
            echo "--- last 120 lines of backend log ---"
            tail -120 backend.log 2>/dev/null || echo "(no backend.log captured)"
            echo "--- health endpoint raw response ---"
            curl -sv http://localhost:8080/api/v1/actuator/health 2>&1 | tail -20 || true
            exit 1
          fi
          echo "Backend is healthy"

      - name: Run E2E tests (smoke)
        run: |
          cd oaiss-chain-frontend
          npm run test:e2e

      - name: Start frontend dev server
        run: |
          cd oaiss-chain-frontend
          # 输出重定向到文件：进程若启动失败，日志是唯一线索
          npx vite --host 127.0.0.1 --port 5173 --strictPort > ../frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          # 必须等到真正监听：v1.1 模式 playwright.config 的 webServer 是
          # undefined（它假设 dev server 已由外部启动），所以不等就绪的话
          # 所有用例都会 ERR_CONNECTION_REFUSED at 127.0.0.1:5173。
          set +e
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:5173/ > /dev/null 2>&1; do sleep 2; done'
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::frontend dev server did not become ready within 90s"
            tail -80 frontend.log 2>/dev/null || true
            exit 1
          fi
          echo "Frontend is ready"

      - name: Run E2E tests (v1.1)
        if: success() || failure()
        run: |
          cd oaiss-chain-frontend
          TEST_MODE=v1.1 npx playwright test

      # TODO(main session decision): wire `bash scripts/run-all-tests.sh` (26 API
      # smoke scripts) into CI. Not enabled here because this job's stack cannot
      # run it as-is:
      #   - DB helpers in test-helpers.sh exec into the `oaiss-mysql` compose
      #     container or fall back to a local `mysql` client; this job only has
      #     the ephemeral `mysql:8.0` GitHub *service* (different container name,
      #     no mysql client on the runner), and its env (DB_PASSWORD=root) must
      #     match db-config.sh expectations.
      #   - Several scripts (market-prediction-test.sh, ...) require the ML
      #     service on localhost:8001, which this job never starts.
      #   - 26 scripts * (20s rate-limit pacing + runtime) exceeds this job's
      #     30-minute timeout.
      # A dedicated job is needed: up infra via docker-compose.infra.yml, build
      # and run the backend (SPRING_PROFILES_ACTIVE=docker, Flyway-seeded users
      # admin123), run the ML service, then execute scripts/run-all-tests.sh.

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: oaiss-chain-frontend/playwright-report/
          retention-days: 7

      - name: Upload production validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation
          path: |
            prod-env-validation.txt
            staging-env-validation.txt
            strict-prod-env-validation.txt
            strict-staging-env-validation.txt
            strict-release-env-validation.txt
            strict-release-compose-config.txt
            prod-compose-config.txt
            release-compose-config.txt
            staging-release-compose-config.txt
            bootstrap-release-host-smoke.txt
            closure-audit.txt
          retention-days: 7

      - name: Stop backend
        if: always()
        run: |
          kill $BACKEND_PID 2>/dev/null || true
